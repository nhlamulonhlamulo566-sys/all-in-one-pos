<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate All In One POS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10201f; color: #f5f7f6; font: 16px Segoe UI, sans-serif; }
    main { width: min(420px, calc(100% - 32px)); padding: 32px; border: 1px solid #31524d; border-radius: 12px; background: #17302d; box-sizing: border-box; }
    h1 { margin-top: 0; font-size: 26px; } p { color: #b5cbc6; line-height: 1.5; }
    input, button { width: 100%; box-sizing: border-box; padding: 13px; border-radius: 7px; font-size: 16px; }
    input { margin: 14px 0; border: 1px solid #4d746c; background: #10201f; color: white; text-transform: uppercase; }
    button { border: 0; background: #f0b44d; color: #18231f; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; } #message { min-height: 24px; margin-top: 14px; color: #ffb5a8; }
  </style>
</head>
<body><main>
  <h1>Activate All In One POS</h1>
  <p>Enter the shop activation token provided by your super administrator. Use the same token on each registered shop computer. This computer must be connected to the internet.</p>
  <input id="token" autocomplete="off" placeholder="SPAZA-XXXXXXXXXX">
  <button id="activate">Activate Computer</button>
  <div id="message" role="status"></div>
  <script>
    const input = document.getElementById('token');
    const button = document.getElementById('activate');
    const message = document.getElementById('message');
    button.addEventListener('click', async () => {
      button.disabled = true; message.textContent = 'Contacting activation server...';
      const result = await window.electronAPI.redeemActivationToken(input.value);
      if (!result.success) { message.textContent = result.message; button.disabled = false; }
    });
  </script>
</main></body>
</html>
